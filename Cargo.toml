[package]
name = "nganjo-gui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nganjo-gui"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.27", features = ["default"] }
egui = "0.27"
egui_extras = { version = "0.27", features = ["all_loaders"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
walkdir = "2"
open = "5"
nix = { version = "0.27", features = ["process", "signal"] }
which = "6"

[profile.release]
opt-level = 3
strip = true
